<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes e cores</title>

    <style>
        .fonteSerif {
            font-family: "Times New Roman", serif;
            font-size: 80px;
        }

        .fonteSansSerif {
            font-family: "Verdana", sans-serif;
            font-size: 40px;
        }

        .fonteMonospace {
            font-family: "Courier New", monospace;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="conteudo">
    <p class="fonteSerif">Programação web</p>

    <p class="fonteSansSerif">Programação web</p>

    <p class="fonteMonospace">Programação web</p>
    </div>
</body>
</html>
